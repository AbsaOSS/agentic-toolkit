name: Test Operational Scripts

on:
  pull_request:
    paths:
      - "skills/**/*.py"
      - "skills/shared/references/schemas/*.schema.json"
      - "scripts/**"
      - "skills/shared/references/living-doc-glossary.md"
      - "skills/shared/references/living-doc-bdd-schemas.md"
      - ".github/workflows/test-scripts.yml"

permissions:
  contents: read

jobs:
  canon-sync-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Every canon copy under skills/shared/references/ is generated by
      # scripts/sync-living-doc-reference.sh and none is hand-maintained. For each target the
      # script declares, re-read the SHA its committed copy pins, re-run the sync against that
      # SHA, and fail on any difference — a hand edit to either copy cannot survive this.
      - name: Re-run the sync for every target and diff against the committed copies
        run: |
          set -euo pipefail

          failures=()
          while IFS=$'\t' read -r target source_path dest; do
            echo "::group::${target} → ${dest}"

            header="$(head -n1 "$dest")"
            ref="$(echo "$header" | sed -nE 's/.*synced from AbsaOSS\/living-doc@([^ ]+).*/\1/p')"
            if [ -z "$ref" ]; then
              echo "Error: no 'synced from AbsaOSS/living-doc@<ref>' header comment on line 1 of ${dest}." >&2
              failures+=("$dest (missing provenance header)")
              echo "::endgroup::"
              continue
            fi

            # The pinned ref must be an immutable 40-character commit SHA. A branch name moves
            # underneath the copy, so re-running the sync against it proves nothing.
            if ! printf '%s' "$ref" | grep -qE '^[0-9a-f]{40}$'; then
              echo "Error: ${dest} pins '${ref}', which is not a 40-character commit SHA." >&2
              echo "Re-sync against an immutable SHA: scripts/sync-living-doc-reference.sh ${target} <sha>" >&2
              failures+=("$dest (ref '${ref}' is not a 40-char SHA)")
              echo "::endgroup::"
              continue
            fi

            cp "$dest" "/tmp/committed-${target}.md"
            bash scripts/sync-living-doc-reference.sh "$target" "$ref"
            if ! diff -u "/tmp/committed-${target}.md" "$dest"; then
              echo
              echo "${dest} is out of sync with AbsaOSS/living-doc@${ref} (${source_path})." >&2
              echo "Run: scripts/sync-living-doc-reference.sh ${target} ${ref}" >&2
              failures+=("$dest (out of sync)")
            fi
            echo "::endgroup::"
          done < <(bash scripts/sync-living-doc-reference.sh --list)

          echo
          if [ "${#failures[@]}" -ne 0 ]; then
            echo "Canon sync check FAILED:"
            printf '  %s\n' "${failures[@]}"
            exit 1
          fi
          echo "All canon copies match their pinned living-doc SHA."

  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml jsonschema

      - name: Discover and run test_*.py scripts
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -euo pipefail

          mapfile -t test_files < <(find skills -type f -name "test_*.py" | sort)

          if [ "${#test_files[@]}" -eq 0 ]; then
            echo "No test_*.py files found under skills/ — nothing to run."
            exit 0
          fi

          echo "Found ${#test_files[@]} test file(s):"
          printf '  %s\n' "${test_files[@]}"
          echo

          failures=()
          for f in "${test_files[@]}"; do
            echo "::group::$f"
            if ! python "$f"; then
              failures+=("$f")
            fi
            echo "::endgroup::"
          done

          echo
          if [ "${#failures[@]}" -ne 0 ]; then
            echo "FAILED (${#failures[@]}/${#test_files[@]}):"
            printf '  %s\n' "${failures[@]}"
            exit 1
          fi

          echo "All ${#test_files[@]} test file(s) passed."
